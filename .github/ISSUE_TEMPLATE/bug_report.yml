name: Bug Report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out as much as you can.

  - type: input
    id: version
    attributes:
      label: yt-x version
      description: Output of `yt-x --version`
      placeholder: "v0.4.5"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Android / Termux
        - Windows (WSL2)
    validations:
      required: true

  - type: input
    id: selector
    attributes:
      label: Selector in use
      description: fzf or rofi
      placeholder: "fzf"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch yt-x
        2. Select "Search"
        3. Type "..."
        4. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / error messages
      render: shell
